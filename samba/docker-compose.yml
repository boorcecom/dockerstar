services:
  samba-ad-dc:
    container_name: samba-ad-dc
    image: samba-ad-dc:trixie
    build:
      context: .
      dockerfile: Dockerfile.samba
    environment:
      TZ: 'Europe/Paris'
    volumes:
      - '/etc/letsencrypt:/etc/letsencrypt:ro'
      - '/opt/samba_storage/krb5.conf:/etc/krb5.conf:ro'
      - '/opt/samba_storage/etc-samba:/etc/samba/'
      - '/opt/samba_storage/varlib-samba:/var/lib/samba/'
      - '/opt/samba_storage/varcache-samba:/var/cache/samba/'
      - '/opt/samba_storage/varlog-samba:/var/log/samba/'
      - '/opt/samba_storage/run-samba:/run/samba/'
      # TODO: à restreindre/passer en :ro selon les partages déclarés dans smb.conf
      - '/opt/pxe:/pxe'
      - '/mnt:/mnt'
    # Plus de "privileged" ni de NET_ADMIN : un DC n'a pas besoin de toucher à la pile réseau
    # de l'hôte. Les ports < 1024 sont couverts par NET_BIND_SERVICE (présent par défaut).
    # Si les ACL/xattr posent problème (erreurs sur sysvol), ajouter en dernier recours :
    #   cap_add:
    #     - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    dns: 192.168.0.240
    dns_search:
      - ad.boorce.com
    hostname: dc01
    networks:
      net_local:
        ipv4_address: 192.168.0.252
        ipv6_address: 2a01:e0a:fda:4170:42:c0ff:fea8:fc
    healthcheck:
      test: ["CMD-SHELL", "smbclient -L 127.0.0.1 -N >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  net_local:
    external: true
    name: net_local
